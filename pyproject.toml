[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geodocs"
version = "0.2.0"
description = "Shared storage of urban planning documents (PZZ, general plans, GPZU, ZOUIT regimes) for pyrgis-agents and pynspd-agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Sergey Malashenko", email = "malashenko_sergey@yahoo.com" }
]
keywords = ["cadastre", "urban-planning", "pzz", "gpzu", "zouit", "rgis", "nspd"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10",
    "pyyaml>=6.0.3",
]

[project.scripts]
geodocs-agent = "geodocs.agent.cli:main"
geodocs-agent-mcp = "geodocs.agent.mcp:main"
geodocs-mcp = "geodocs.server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.27",
]

[dependency-groups]
test = [
    "pytest>=8.3",
    "respx>=0.23.1",
    "geodocs[mcp]",
]
lint = [
    "ruff>=0.8.4",
]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
default-groups = ["test", "lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
